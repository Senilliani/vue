<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VUE</title>
  </head>
  <body>
    <div id="miApp">
      <h1>Clientes {{totalQuotes}}</h1>
      <input
        type="text"
        placeholder="add quote"
        @keypress.enter="addQuote"
        v-model="newMessage"
      />
      <br />
      <br />
      <button @click="toggleAuthor">Toggle</button>
      <hr />

      <ul>
        <li v-for="({author, quote}, index) in quotes">
          {{index +1}} - {{quote}}
          <div v-show="showAuthor">{{author}}</div>
        </li>
      </ul>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="app.js"></script>
  </body>
</html>
